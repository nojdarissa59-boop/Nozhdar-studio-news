<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patente B">
<title>Patente B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --card:#1E1F22; --card2:#26272B; --line:#33353A;
  --text:#F2F2F2; --muted:#9A9CA3;
  --accent:#F59E0B; --blue:#4FA9EE;
  --green:#4A9A27; --green-d:#33701A; --red:#C0392B; --red-d:#8E2A20;
  --dock-pad:14px;
}
@media (hover:none) and (pointer:coarse){ :root{ --dock-pad:64px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* شاشەی نارنجی */
.splash{position:fixed;inset:0;z-index:100;background:#FF6A00;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.avatar{width:176px;height:176px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.avatar svg{width:104px;height:104px}
.splash h1{margin:6px 0 0;font-size:1.7rem;font-weight:800}
.splash p{margin:0;opacity:.9}
.bar{width:min(240px,60vw);height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:34px}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:rgba(255,255,255,.85);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:60%}}
#splash-status{font-size:.95rem;opacity:.85;min-height:26px}
.splash .btn{background:#fff;color:#C24E00}

/* سەرەوە */
.flagline{height:5px;background:linear-gradient(90deg,#009246 0 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%)}
header{background:#16181c;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.brand{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand>div:nth-child(2){flex:1;min-width:0}
.toolbar{max-width:560px;margin:14px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:flex-start}
.plate{flex:none;width:52px;height:52px;border-radius:12px;background:#fff;color:#0B4F9E;display:grid;place-items:center;font-weight:800;font-size:1.7rem;direction:ltr}
.brand h1{margin:0;font-size:1.15rem;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{display:flex;gap:6px;direction:ltr;flex-wrap:wrap;align-items:center}
.flags .fl{width:40px;height:27px;border-radius:5px;border:1.5px solid #3a3c42;object-fit:cover;flex:none;display:block}
.flags svg{width:40px;height:27px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}

/* زمانەکان: دوگمە + شیتی خوارەوە */
.lbtn{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:700;cursor:pointer}
.lbtn svg{width:18px;height:18px}
.sheet-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:#fff;color:#111;border-radius:22px 22px 0 0;padding:10px 0 calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:#ccc;margin:0 auto 10px}
.sheet h3{margin:6px 22px 12px;font-size:1.25rem;font-weight:800}
.sheet button.item{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:transparent;padding:15px 22px;font-size:1.1rem;font-weight:600;color:#111;cursor:pointer;text-align:start}
.sheet button.item.on{background:#E6F7F3;color:#0B6B55}
.sheet button.item .tick{color:#0B6B55;font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.topbar h1{margin:0;font-size:1.5rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px;color:var(--muted)}
input[type=text],input[type=password],input[type=email],input[type=number],select{width:100%;font-size:1rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--text)}
select{margin-bottom:12px}
.btn{border:0;background:var(--accent);color:#111;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer}
.btn.block{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);font-weight:600}
.btn.small{padding:7px 14px;font-size:.88rem;border-radius:10px}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.55}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.92rem;display:none}
.msg.show{display:block}
.msg.err{background:#3a1a18;color:#ffb4a8}
.msg.ok{background:#16301a;color:#a9e6b4}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--card2);color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.status{margin-top:18px;color:var(--muted);font-size:.9rem;text-align:center}

/* Instagram */
.insta{margin-top:18px;border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:center;background:linear-gradient(160deg,#1E1F22,#22181f)}
.insta p{margin:0 0 10px;font-weight:600}
.insta a{display:inline-block;text-decoration:none;color:#fff;font-weight:800;padding:10px 20px;border-radius:12px;background:linear-gradient(90deg,#F58529,#DD2A7B,#8134AF);direction:ltr}

/* سەرەکی */
.hello{font-size:2rem;font-weight:800;margin:8px 0 16px;line-height:1.3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;min-height:158px;border:0;border-radius:24px;padding:16px;text-align:start;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.tile.t1{background:linear-gradient(160deg,#E8A13A,#C98A30)}
.tile.t2{background:linear-gradient(160deg,#52ABEF,#3F8FD0)}
.tile .ico{position:absolute;top:14px;inset-inline-start:14px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile .ico svg{width:26px;height:26px}
.tile .badge{position:absolute;top:16px;inset-inline-end:14px;background:rgba(0,0,0,.22);border-radius:99px;padding:1px 12px;font-weight:800;font-size:.9rem}
.tile b{font-size:1.25rem;display:block;line-height:1.3}
.tile span{font-size:.88rem;opacity:.9}

/* تاقیکردنەوە */
.bubwrap{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.bubs{flex:1;display:flex;gap:8px;overflow-x:auto;padding:8px;border-radius:99px;background:#2a2314;scrollbar-width:none;direction:ltr}
.bubs::-webkit-scrollbar{display:none}
.bub{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #5a4620;background:transparent;color:#E6D3A8;font-weight:800;cursor:pointer}
.bub.done{background:#3d3015}
.bub.cur{background:var(--accent);border-color:var(--accent);color:#111}
.navrow{display:flex;gap:10px;align-items:center;margin-bottom:12px;direction:ltr}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#2a2314;color:var(--accent);font-size:1.3rem;cursor:pointer}
.pill{flex:1;display:flex;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pill span{flex:1;text-align:center;padding:9px 4px;font-weight:700;font-size:.92rem;white-space:nowrap}
.pill span+span{border-inline-start:1.5px solid var(--line)}
.pill .timer{color:var(--accent);direction:ltr}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.signbox{background:#F4F4F1;padding:16px;display:grid;place-items:center}
.signbox:empty{display:none}
.sign-img{max-width:210px;max-height:210px;display:block}
.qmeta{padding:12px 18px 0;color:var(--muted);font-size:.82rem;direction:ltr;text-align:left}
.qtext{direction:ltr;text-align:left;padding:4px 18px 16px;font-size:1.22rem;font-weight:600;line-height:1.55}
.tr{margin:0 12px 12px;background:#182233;border-radius:12px;border-inline-start:5px solid var(--accent);padding:12px 14px}
.tr-label{font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:2px}
.tr-body{font-size:1.1rem;font-weight:600;line-height:1.85;color:#E8EEF8}
.tr-body.loading{color:var(--muted);font-weight:400}
.verdict{display:inline-block;margin:0 18px 16px;padding:4px 16px;border-radius:10px;font-weight:800;color:#fff;direction:ltr}
.verdict.v{background:var(--green)} .verdict.f{background:var(--red)}
.dock{position:sticky;bottom:0;z-index:10;background:linear-gradient(to top,var(--bg) 78%,rgba(17,18,20,0));padding:18px 0 calc(var(--dock-pad) + env(safe-area-inset-bottom));margin-top:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{border:0;border-radius:18px;padding:16px 8px;color:#fff;cursor:pointer;font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.ans.v{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.ans.f{background:var(--red);box-shadow:0 6px 0 var(--red-d)}
.ans:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ans.sel{outline:3px solid #fff;outline-offset:2px}
.ans small{display:block;font-weight:600;font-size:.82rem;opacity:.9;letter-spacing:0}

/* ئەنجام */
.score{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px 16px;margin-bottom:16px}
.score .big{font-size:3.2rem;font-weight:800;line-height:1.1;direction:ltr}
.score.pass{border-color:var(--green)} .score.pass .big{color:#6fd24a}
.score.fail{border-color:var(--red)} .score.fail .big{color:#ff6a58}
.review-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.review-item.bad{border-color:#6b2b26}
.review-head{padding:10px 16px;font-weight:800;font-size:.95rem}
.review-head.ok{color:#6fd24a} .review-head.no{color:#ff7a69}
.review-item .sign-img{max-width:100px;margin:0 16px 8px;background:#F4F4F1;border-radius:8px;padding:4px}
.review-q{direction:ltr;text-align:left;padding:0 16px 10px;font-weight:600}
.review-ans{padding:0 16px 12px;font-size:.9rem;color:var(--muted)}
.review-ans b{color:var(--text);direction:ltr;unicode-bidi:isolate}

/* ئەدمین */
.ulist{display:grid;gap:10px;margin-top:14px}
.uitem{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.uitem .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.uitem b{font-size:1.05rem;word-break:break-all}
.tag{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.tag.new{background:#16301a;color:#a9e6b4}
.tag.used{background:#2b2b30;color:#c9cad1}
.tag.lock{background:#3a1a18;color:#ffb4a8}
.uitem .meta{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.cred{margin-top:12px;padding:12px;border-radius:12px;background:#16301a;color:#d4f5da;direction:ltr;text-align:left;white-space:pre-line;font-weight:600}

/* فشردەکردنی شاشەی چوونەژوورەوە تاکو هەمووی لە یەک شاشەدا دیار بێت */
header{padding:10px 16px 8px;position:relative}
.plate{width:40px;height:40px;font-size:1.3rem;border-radius:10px}
.brand{gap:10px}
.brand h1{font-size:1rem}
.brand p{font-size:.75rem;margin-top:0}
.toolbar{margin-top:8px;gap:8px}
.lbtn{padding:5px 10px;font-size:.8rem}
.flags svg{width:32px;height:22px}
.wrap{padding:10px 14px}
.topbar{margin-bottom:8px}
.topbar h1{font-size:1.25rem}
.btn.small{padding:5px 12px;font-size:.8rem}
.card{padding:12px}
label{margin:8px 0 4px;font-size:.8rem}
input[type=text],input[type=password],input[type=email],input[type=number],select{padding:9px 12px;font-size:.95rem}
.btn{padding:9px 16px;font-size:.95rem}
.btn.block{margin-top:10px}
.note{margin-top:8px;padding:8px 10px;font-size:.8rem;line-height:1.5}
.card .note{margin:0 0 4px;padding:6px 10px}
.insta{margin-top:10px;padding:10px}
.insta p{font-size:.85rem;margin-bottom:6px}
.insta a{padding:7px 16px;font-size:.9rem}

.qlisten{padding:0 18px 14px}
.speak{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);padding:8px 16px;border-radius:999px;font-size:.95rem;font-weight:800;cursor:pointer}
.speak:active{transform:scale(.97)}

/* حاڵەتی تاقیکردنەوە و خوێندن: هیچ هێدەرێک نییە، هەموو شتەکان لە یەک شاشەدا */
body.inquiz{--dock-pad:30px}
body.inquiz header,body.inquiz .flagline{display:none}
body.inquiz .wrap{padding:6px 10px;max-width:600px}
body.inquiz .bubwrap{margin-bottom:6px;gap:8px}
body.inquiz .bubs{padding:4px;gap:6px}
body.inquiz .bub{width:30px;height:30px;font-size:.8rem;border-width:1.5px}
body.inquiz .bubwrap .btn{padding:6px 12px;font-size:.85rem;border-radius:10px}
body.inquiz .navrow{margin-bottom:6px;gap:8px}
body.inquiz .arrow{width:34px;height:34px;font-size:1.1rem}
body.inquiz .pill span{padding:5px 4px;font-size:.8rem}
body.inquiz .qcard{border-radius:14px}
body.inquiz .signbox{padding:6px}
body.inquiz .sign-img{max-width:150px;max-height:110px}
body.inquiz .qmeta{padding:6px 12px 0;font-size:.72rem}
body.inquiz .qtext{padding:2px 12px 6px;font-size:1.02rem;line-height:1.4}
body.inquiz .tr{margin:0 8px 8px;padding:7px 10px;border-radius:10px}
body.inquiz .tr-label{font-size:.7rem}
body.inquiz .tr-body{font-size:.95rem;line-height:1.5}
body.inquiz .qlisten{padding:0 12px 8px}
body.inquiz .speak{padding:4px 12px;font-size:.8rem}
body.inquiz .verdict{margin:0 12px 8px;font-size:.85rem;padding:2px 12px}
body.inquiz .dock{padding:8px 0 calc(var(--dock-pad) + env(safe-area-inset-bottom));margin-top:6px}
body.inquiz .answers{gap:10px}
body.inquiz .ans{padding:9px 6px;font-size:1.1rem;border-radius:14px}
body.inquiz .ans small{font-size:.7rem}
body.inquiz .ans:active{transform:translateY(2px)}
body.inquiz #exam-screen .dock > div:last-child{margin-top:8px !important}
body.inquiz .dock .btn.ghost.small{padding:4px 12px;font-size:.78rem}
body.inquiz #topic-filter{margin-bottom:6px;padding:7px 10px;font-size:.88rem}
body.inquiz #study-screen .row{margin-bottom:6px !important}
body.inquiz #jump-input{padding:6px 10px;font-size:.88rem}
body.inquiz #study-screen .row .btn{padding:6px 14px;font-size:.88rem}
body.inquiz #study-screen .dock .btn{padding:7px 14px;font-size:.88rem}
body.inquiz #study-screen .dock .btn.ghost{padding:7px 12px}

/* نوسخەی ئەپ ستۆر: ئەدمین، ڕێنمایی Add to Home Screen و بۆکسی ئینستاگرام نیشان نادرێن */
body.store button[onclick="showAdminLogin()"],
body.store #back-admin,
body.store .insta,
body.store [data-i18n="loginNote"]{display:none !important}
.igtop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:12px;z-index:5;font-size:.78rem;font-weight:800;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#F58529,#DD2A7B,#8134AF);direction:ltr}
.logout{display:none;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:5;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;cursor:pointer}
body.loggedin .logout{display:inline-block}
</style>
</head>
<body class="store">

<!-- ============ شاشەی نارنجی ============ -->
<div id="splash" class="splash">
  <div class="avatar">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="10" width="80" height="80" rx="18" fill="#0B4F9E"/><rect x="10" y="78" width="26" height="12" fill="#009246"/><rect x="36" y="78" width="28" height="12" fill="#fff"/><rect x="64" y="78" width="26" height="12" fill="#C8102E"/><text x="50" y="66" text-anchor="middle" font-size="56" font-weight="800" fill="#fff" font-family="Vazirmatn,Arial,sans-serif">B</text></svg>
  </div>
  <h1>Patente B</h1>
  <p data-i18n="brandSub"></p>
  <div class="bar"><i></i></div>
  <div id="splash-status"></div>
  <button class="btn hidden" id="splash-retry" data-i18n="retryLoad" onclick="boot()"></button>
</div>

<!-- ============ سەرەوە و زمانەکان (هەمیشە دیارە) ============ -->
<div class="flagline"></div>
<header>
  <button id="logout-btn" class="logout" data-i18n="signOut" onclick="logout()"></button>
  <div class="brand">
    <div class="plate">B</div>
    <div>
      <h1 data-i18n="appTitle"></h1>
      <p data-i18n="brandSub"></p>
    </div>
  </div>
  <div class="toolbar"><button class="lbtn" id="lang-open" onclick="openLang()" aria-haspopup="dialog">

const cache = {}, tokens = {}, pending = {};

function latinToArabicKurdish(text){
  const map = {'ê':'ێ','î':'ی','û':'وو','ç':'چ','ş':'ش','b':'ب','c':'ج','d':'د','f':'ف','g':'گ','h':'ه','j':'ژ','k':'ک','l':'ل','m':'م','n':'ن','p':'پ','q':'ق','r':'ر','s':'س','t':'ت','v':'ڤ','w':'و','x':'خ','y':'ی','z':'ز','a':'ا','e':'ە','i':'','o':'ۆ','u':'و'};
  const vowels = 'aeiouêîû';
  return text.split(/(\s+)/).map(word => {
    if (/^\s*$/.test(word)) return word;
    const lower = word.toLowerCase(); let out = '';
    for (let i = 0; i < lower.length; i++){
      const ch = lower[i];
      if (i === 0 && vowels.includes(ch)){ out += 'ئ' + (map[ch] || ''); continue; }
      if (map[ch] !== undefined) out += map[ch];
      else if (ch === '?') out += '؟';
      else if (ch === ',') out += '،';
      else out += ch;
    }
    return out;
  }).join('');
}

async function fetchJSON(url, ms){
  const c = new AbortController(); const tm = setTimeout(() => c.abort(), ms || 8000);
  try {
    const r = await fetch(url, { signal: c.signal, referrerPolicy:'no-referrer' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const PROVIDERS = [
  { name:'google', run: async (text, tl) => {
      const d = await fetchJSON(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
      return d[0].map(p => p[0]).join('');
  }},
  { name:'google2', run: async (text, tl) => {
      const d = await fetchJSON(`https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=it&tl=${tl}&q=${encodeURIComponent(text)}`);
      if (d && d.sentences) return d.sentences.map(x => x.trans).join('');
      if (Array.isArray(d)){ const f = d[0]; return Array.isArray(f) ? f[0] : f; }
      throw new Error('bad format');
  }},
  { name:'mymemory', run: async (text, tl) => {
      const d = await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=it|${tl}`);
      const r = d && d.responseData && d.responseData.translatedText;
      if (!r || /MYMEMORY WARNING|INVALID/i.test(r)) throw new Error('mymemory');
      return r;
  }}
];
function translateText(text, lang){
  const key = lang + '|' + text;
  if (cache[key]) return Promise.resolve(cache[key]);
  if (pending[key]) return pending[key];
  const L = LANGS[lang];
  pending[key] = (async () => {
    const errs = [];
    for (const p of PROVIDERS){
      try {
        let out = await p.run(text, L.tl);
        if (!out || !out.trim()) throw new Error('empty');
        if (L.arabic) out = latinToArabicKurdish(out);
        cache[key] = out; return out;
      } catch(e){ errs.push(p.name + ': ' + (e && e.message ? e.message : e)); }
    }
    throw new Error(errs.join(' | '));
  })();
  pending[key].finally(() => { delete pending[key]; }).catch(() => {});
  return pending[key];
}
async function showTranslation(boxId, text){
  const box = $(boxId); const L = LANGS[currentLang];
  if (L.none){ box.classList.add('hidden'); return; }
  const label = box.querySelector('.tr-label'), body = box.querySelector('.tr-body');
  box.classList.remove('hidden');
  label.textContent = L.label; body.dir = L.dir; body.style.textAlign = L.dir === 'ltr' ? 'left' : 'right';
  body.classList.add('loading'); body.textContent = '...';
  const token = tokens[boxId] = (tokens[boxId] || 0) + 1;
  try {
    const r = await translateText(text, currentLang);
    if (tokens[boxId] !== token) return;
    body.classList.remove('loading'); body.textContent = r;
  } catch(e){
    if (tokens[boxId] !== token) return;
    body.classList.remove('loading');
    body.textContent = t('transFail') + ' ';
    const rb = document.createElement('button');
    rb.className = 'btn small'; rb.textContent = t('retry'); rb.onclick = () => showTranslation(boxId, text);
    body.appendChild(rb);
    const sm = document.createElement('div');
    sm.style.cssText = 'direction:ltr;text-align:left;font-size:.7rem;font-weight:400;color:#9A9CA3;margin-top:6px;word-break:break-all';
    sm.textContent = String(e && e.message || e);
    body.appendChild(sm);
  }
}

let itVoice = null;
function pickItVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^it[-_]IT/i.test(v.lang)) || vs.find(v => /^it/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { itVoice = pickItVoice(); };
  itVoice = pickItVoice();
}
function speak(text){
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT';
  u.rate = 0.9;
  if (!itVoice) itVoice = pickItVoice();
  if (itVoice) u.voice = itVoice;
  speechSynthesis.speak(u);
}

async function rpc(fn, args, jwt){
  const headers = { 'Content-Type':'application/json', 'apikey': SUPABASE_KEY };
  if (jwt) headers['Authorization'] = 'Bearer ' + jwt;
  const r = await fetch(`${BASE}/rest/v1/rpc/${fn}`, { method:'POST', headers, body: JSON.stringify(args || {}) });
  if (!r.ok){
    let m = ''; try { m = (await r.json()).message || ''; } catch(e){}
    throw new Error(m || ('HTTP ' + r.status));
  }
  return r.json();
}

    } else {
      const m = { bad: t('errBad'), locked: t('errLocked'), used: t('errUsed') };
      setMsg('l-err', m[res.reason] || t('errBad'), 'err');
    }
  } catch(e){ setMsg('l-err', t('errNet') + ': ' + e.message, 'err'); }
  finally { btn.disabled = false; }
}

function startChecks(){
  stopChecks();
  checkTimer = setInterval(recheck, 60000);
  if (!checksBound){
    checksBound = true;
    document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
  }
}
function stopChecks(){ if (checkTimer){ clearInterval(checkTimer); checkTimer = null; } }
async function recheck(){
  if (adminPreview || isHidden('app')) return;
  if (!sessionTok) return kickOut('gone');
  try {
    const res = await rpc('user_check', { p_token: sessionTok });
    if (!res.ok) kickOut(res.reason === 'locked' ? 'locked' : 'gone');
  } catch(e){ /* بێ ئینتەرنێت، دواتر دووبارە دەپشکنرێت */ }
}
function kickOut(reason){ clearInterval(timerInterval); sessionTok = null; showLogin(reason); }

/* ================= ئەدمین ================= */
function showAdminLogin(){ showOnly('admin-login'); applyI18n(); setMsg('adm-err',''); }

async function adminSignIn(){
  if (!configured()){ setMsg('adm-err', t('errCfg'), 'err'); return; }
  const email = $('adm-email').value.trim(), pass = $('adm-pass').value;
  if (!email || !pass){ setMsg('adm-err', t('errEnter'), 'err'); return; }
  const btn = $('adm-btn'); btn.disabled = true; setMsg('adm-err', '');
  try {
    const r = await fetch(`${BASE}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) throw new Error(t('errAdminLogin'));
    adminJwt = d.access_token; $('adm-pass').value = '';
    showOnly('admin-panel'); applyI18n(); loadUsers();
  } catch(e){ setMsg('adm-err', e.message, 'err'); }
  finally { btn.disabled = false; }
}

function adminSignOut(){ adminJwt = null; adminPreview = false; showLogin(''); }
function adminPreviewApp(){ adminPreview = true; enterApp(); }
function backToAdmin(){ clearInterval(timerInterval); adminPreview = false; showOnly('admin-panel'); applyI18n(); loadUsers(); }

function fmtDate(s){ if (!s) return '—'; try { return new Date(s).toLocaleString('en-GB', { dateStyle:'short', timeStyle:'short' }); } catch(e){ return s; } }

async function loadUsers(){
  const box = $('ulist');
  box.innerHTML = '<div class="status">⏳</div>';
  try {
    const list = await rpc('admin_list', {}, adminJwt);
    box.innerHTML = '';
    if (!list.length){ box.innerHTML = '<div class="status">—</div>'; return; }
    list.forEach(u => {
      const d = document.createElement('div');
      d.className = 'uitem';
      const tagCls = u.locked ? 'lock' : (u.used ? 'used' : 'new');
      const tagTxt = u.locked ? t('st_locked') : (u.used ? t('st_used') : t('st_new'));
      d.innerHTML = `<div class="top"><b></b><span class="tag ${tagCls}">${tagTxt}</span></div>
        <div class="meta">${t('created')}: ${fmtDate(u.created_at)} · ${t('seen')}: ${fmtDate(u.last_seen)}</div>
        <div class="row"></div>`;
      d.querySelector('b').textContent = u.name;
      const row = d.querySelector('.row');
      const lock = document.createElement('button');
      lock.className = 'btn ghost small';
      lock.textContent = u.locked ? t('unlock') : t('lock');
      lock.onclick = () => adminAct('admin_set_lock', { p_id: u.id, p_locked: !u.locked });
      const del = document.createElement('button');
      del.className = 'btn danger small';
      del.textContent = t('del');
      del.onclick = () => { if (confirm(t('confirmDel', u.name))) adminAct('admin_delete', { p_id: u.id }); };
      row.appendChild(lock); row.appendChild(del);
      box.appendChild(d);
    });
  } catch(e){
    box.innerHTML = '';
    const msg = /forbidden/i.test(e.message) ? t('errAdminNo') : e.message;
    const el = document.createElement('div'); el.className = 'msg err show'; el.textContent = msg; box.appendChild(el);
  }
}
async function adminAct(fn, args){
  try { await rpc(fn, args, adminJwt); loadUsers(); }
  catch(e){ alert(e.message); }
}

function genPass(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const a = new Uint32Array(8); crypto.getRandomValues(a);
  $('n-pass').value = Array.from(a, x => chars[x % chars.length]).join('');
}
let lastCred = '';
async function createUser(){
  const name = $('n-name').value.trim(), pass = $('n-pass').value;
  $('n-cred').classList.add('hidden'); $('n-copy').classList.add('hidden');
  if (name.length < 2 || pass.length < 6){ setMsg('n-msg', t('errNameShort'), 'err'); return; }
  try {
    const res = await rpc('admin_create', { p_name: name, p_pass: pass }, adminJwt);
    if (!res.ok){ setMsg('n-msg', res.reason === 'exists' ? t('errExists') : t('errNameShort'), 'err'); return; }
    setMsg('n-msg', t('passOk'), 'ok');
    lastCred = `${t('name')}: ${name}\n${t('pass')}: ${pass}`;
    $('n-cred').textContent = lastCred;
    $('n-cred').classList.remove('hidden'); $('n-copy').classList.remove('hidden');
    $('n-name').value = ''; $('n-pass').value = '';
    loadUsers();
  } catch(e){ setMsg('n-msg', e.message, 'err'); }
}
async function copyCred(){
  try { await navigator.clipboard.writeText(lastCred); $('n-copy').textContent = t('copied'); setTimeout(() => { $('n-copy').textContent = t('copy'); }, 1500); }
  catch(e){ alert(lastCred); }
}

/* ================= ئەپی کویز ================= */
async function enterApp(){
  showOnly('app');
  $('back-admin').classList.toggle('hidden', !adminPreview);
  applyI18n();
  if (!adminPreview) startChecks(); else stopChecks();
  if (!allQuestions.length) await loadDatabase(); else goHome();
}

let allQuestions = [], filteredQuestions = [];
const REPO_BASE = "https://raw.githubusercontent.com/Ed0ardo/QuizPatenteB/main";
const JSON_URL = `${REPO_BASE}/quizPatenteB2023.json`;

function show(id){
  ['loading-box','home-screen','exam-screen','result-screen','study-screen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  document.body.classList.toggle('inquiz', id === 'exam-screen' || id === 'study-screen');
  window.scrollTo(0,0);
}

async function loadDatabase(){
  show('loading-box'); setLoadingText();
  try {
    const data = await (await fetch(JSON_URL)).json();
    allQuestions = [];
    for (const topic in data){
      for (const sub in data[topic]){
        data[topic][sub].forEach(item => {
          let imgUrl = null;
          if (item.img) imgUrl = `${REPO_BASE}/${item.img.replace(/^\//, '')}`;
          allQuestions.push({ topic, subtopic: sub, it: item.q, answer: item.a, sign: imgUrl });
        });
      }
    }
    filteredQuestions = [...allQuestions];
    populateTopics(Object.keys(data));
    $('count-badge').textContent = allQuestions.length;
    goHome();
  } catch(err){
    $('loading-box').innerHTML = t('loadErr') + '<br><br><button class="btn" onclick="loadDatabase()">' + t('retryLoad') + '</button>';
  }
}
function updateHome(){
  $('hello').textContent = adminPreview ? t('kin') : t('hello', userName);
  $('db-status-text').textContent = t('ready', allQuestions.length);
}
function goHome(){
  clearInterval(timerInterval);
  show('home-screen');
  updateHome();
}
function prettyTopic(tp){ return tp.replace(/-/g, ' '); }
function populateTopics(topics){
  const sel = $('topic-filter');
  sel.innerHTML = `<option value="ALL">${t('subjectAll')} (${allQuestions.length})</option>`;
  topics.forEach(tp => {
    const c = allQuestions.filter(q => q.topic === tp).length;
    const o = document.createElement('option'); o.value = tp; o.textContent = `${prettyTopic(tp)} (${c})`; sel.appendChild(o);
  });
}
function filterByTopic(){
  const v = $('topic-filter').value;
  filteredQuestions = v === 'ALL' ? [...allQuestions] : allQuestions.filter(q => q.topic === v);
  studyIndex = 0; loadStudyQuestion();
}
function signHtml(q){ return q.sign ? `<img src="${q.sign}" class="sign-img" alt="" onerror="this.style.display='none'">` : ''; }
function shuffle(a){ const b = [...a]; for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

/* ================= تاقیکردنەوە ================= */
let examQuestions = [], answers = [], cur = 0, timeLeft = 1200;

function startExam(){
  show('exam-screen');
  examQuestions = shuffle(allQuestions).slice(0, 30);
  answers = Array(30).fill(null); cur = 0;
  $('bubbles').innerHTML = '';
  startTimer(); renderExam();
}
function startTimer(){
  timeLeft = 1200; clearInterval(timerInterval);
  const tick = () => {
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    $('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (timeLeft <= 0){ clearInterval(timerInterval); finishExam(); return; }
    timeLeft--;
  };
  tick(); timerInterval = setInterval(tick, 1000);
}
function renderExam(){
  const q = examQuestions[cur];
  if (!q) return;
  const bub = $('bubbles');
  if (bub.children.length !== 30){
    bub.innerHTML = '';
    for (let i = 0; i < 30; i++){
      const b = document.createElement('button');
      b.className = 'bub'; b.textContent = i + 1;
      b.onclick = () => { cur = i; renderExam(); };
      bub.appendChild(b);
    }
  }
  [...bub.children].forEach((b, i) => { b.classList.toggle('cur', i === cur); b.classList.toggle('done', answers[i] !== null && i !== cur); });
  const curEl = bub.children[cur];
  bub.scrollLeft = curEl.offsetLeft - bub.clientWidth / 2 + curEl.offsetWidth / 2;

  $('exam-pos').textContent = t('qOf', cur + 1);
  $('exam-done').textContent = t('answersN', answers.filter(a => a !== null).length);
  $('exam-sign').innerHTML = signHtml(q);
  $('exam-meta').textContent = prettyTopic(q.topic);
  $('exam-q-text').textContent = q.it;
  $('btn-v').classList.toggle('sel', answers[cur] === true);
  $('btn-f').classList.toggle('sel', answers[cur] === false);
  showTranslation('exam-tr', q.it);
  if (examQuestions[cur + 1]) prefetch(examQuestions[cur + 1].it);
}
function stepExam(d){ cur = Math.min(29, Math.max(0, cur + d)); renderExam(); }
function answerExam(v){ answers[cur] = v; if (cur < 29) cur++; renderExam(); }
function cancelExam(){ if (confirm(t('confirmCancel'))) goHome(); }
function submitExam(){
  const left = answers.filter(a => a === null).length;
  if (left > 0 && !confirm(t('leftQ', left))) return;
  finishExam();
}
function finishExam(){
  clearInterval(timerInterval);
  buildResult();
  show('result-screen');
}
function buildResult(){
  let correct = 0;
  examQuestions.forEach((q, i) => { if (answers[i] === q.answer) correct++; });
  const errors = 30 - correct;
  const passed = errors <= 3;
  $('score-card').className = 'score ' + (passed ? 'pass' : 'fail');
  $('score-big').textContent = `${correct} / 30`;
  $('score-text').textContent = (passed ? t('passed') : t('failed')) + ' — ' + t('errorsL', errors);
  const list = $('review-list'); list.innerHTML = '';
  examQuestions.forEach((q, i) => {
    const ok = answers[i] === q.answer;
    const yours = answers[i] === null ? '—' : (answers[i] ? t('vero') : t('falso'));
    const d = document.createElement('div');
    d.className = 'review-item' + (ok ? '' : ' bad');
    d.innerHTML = `<div class="review-head ${ok ? 'ok' : 'no'}">${i + 1}: ${ok ? t('right') : t('wrong')}</div>
      ${signHtml(q)}<div class="review-q"></div>
      ${ok ? '' : `<div class="tr hidden" id="rv-tr-${i}"><div class="tr-label"></div><div class="tr-body"></div></div>`}
      <div class="review-ans">${t('yourA')}: <b>${yours}</b> · ${t('rightA')}: <b>${q.answer ? t('vero') : t('falso')}</b></div>`;
    d.querySelector('.review-q').textContent = q.it;
    list.appendChild(d);
  });
  examQuestions.forEach((q, i) => { if (answers[i] !== q.answer && $(`rv-tr-${i}`)) showTranslation(`rv-tr-${i}`, q.it); });
  window.scrollTo(0,0);
}

/* سڕینەوەی هەژماری خۆی بەکارهێنەر (پێویستە بۆ App Store) */
async function deleteMyAccount(){
  if (!sessionTok) return;
  if (!confirm(t('deleteMeConfirm'))) return;
  try {
    const res = await rpc('user_delete', { p_token: sessionTok });
    if (res.ok){ sessionTok = null; alert(t('passOk')); showLogin(''); }
  } catch(e){ alert(t('errNet')); }
}

/* ================= خوێندن ================= */
let studyIndex = 0;
function startStudy(){ show('study-screen'); studyIndex = 0; loadStudyQuestion(); }
function loadStudyQuestion(){
  const q = filteredQuestions[studyIndex]; if (!q) return;
  $('study-sign').innerHTML = signHtml(q);
  $('study-meta').textContent = `${studyIndex + 1} / ${filteredQuestions.length} · ${prettyTopic(q.topic)}`;
  $('study-q-text').textContent = q.it;
  showTranslation('study-tr', q.it);
  const a = $('study-ans-val');
  a.textContent = q.answer ? 'VERO ✓' : 'FALSO ✗';
  a.className = 'verdict ' + (q.answer ? 'v' : 'f');
  if (filteredQuestions[studyIndex + 1]) prefetch(filteredQuestions[studyIndex + 1].it);
}
function nextStudyQ(){ if (studyIndex < filteredQuestions.length - 1){ studyIndex++; loadStudyQuestion(); window.scrollTo(0,0); } }
function prevStudyQ(){ if (studyIndex > 0){ studyIndex--; loadStudyQuestion(); window.scrollTo(0,0); } }
function jumpToQ(){
  const n = parseInt($('jump-input').value);
  if (n >= 1 && n <= filteredQuestions.length){ studyIndex = n - 1; loadStudyQuestion(); window.scrollTo(0,0); }
}

/* ================= دەستپێکردن ================= */
$('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('adm-pass').addEventListener('keydown', e => { if (e.key === 'Enter') adminSignIn(); });
applyI18n();
boot();
