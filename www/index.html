<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هەواڵەکانی ئەلتۆ ئادیجێ و کۆچبەران — Patente App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.35rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .news-title {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .news-summary {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    a.read-more {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      padding: 36px;
      color: var(--muted);
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="pageTitle">هەواڵەکان</h1>
      <div>
        <button id="btnKu" class="active" onclick="setLang('ku')">کوردی</button>
        <button id="btnIt" onclick="setLang('it')">Italiano</button>
      </div>
    </header>

    <div class="controls">
      <button id="catAll" class="active" onclick="setCategory('all')">هەموو</button>
      <button id="catAlto" onclick="setCategory('alto-adige')">Alto Adige</button>
      <button id="catRefugees" onclick="setCategory('refugees')">کۆچبەران / ئیتاڵیا</button>
    </div>

    <div id="newsList" class="grid"></div>
  </div>

  <script>
    let allNews = [];
    let currentLang = 'ku';
    let currentCategory = 'all';

    const UI_TEXT = {
      ku: {
        dir: 'rtl',
        title: 'هەواڵەکانی ئەلتۆ ئادیجێ و کۆچبەران',
        all: 'هەموو',
        alto: 'Alto Adige',
        refugees: 'کۆچبەران / ئیتاڵیا',
        readMore: 'خوێندنی هەواڵ ←',
        empty: 'هیچ هەواڵێک لەم بەشەدا نەدۆزرایەوە.'
      },
      it: {
        dir: 'ltr',
        title: 'Notizie Alto Adige e Immigrazione',
        all: 'Tutti',
        alto: 'Alto Adige',
        refugees: 'Immigrazione / Italia',
        readMore: 'Leggi articolo →',
        empty: 'Nessuna notizia trovata in questa sezione.'
      }
    };

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'ku' ? 'ckb' : 'it';
      document.documentElement.dir = UI_TEXT[lang].dir;
      document.getElementById('btnKu').classList.toggle('active', lang === 'ku');
      document.getElementById('btnIt').classList.toggle('active', lang === 'it');
      document.getElementById('pageTitle').textContent = UI_TEXT[lang].title;
      document.getElementById('catAll').textContent = UI_TEXT[lang].all;
      document.getElementById('catAlto').textContent = UI_TEXT[lang].alto;
      document.getElementById('catRefugees').textContent = UI_TEXT[lang].refugees;
      renderNews();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.getElementById('catAll').classList.toggle('active', cat === 'all');
      document.getElementById('catAlto').classList.toggle('active', cat === 'alto-adige');
      document.getElementById('catRefugees').classList.toggle('active', cat === 'refugees');
      renderNews();
    }

    function getLocalizedField(field) {
      if (!field) return '';
      if (typeof field === 'string') return field;
      return field[currentLang] || field.ku || field.it || '';
    }

    function renderNews() {
      const container = document.getElementById('newsList');
      const filtered = currentCategory === 'all'
        ? allNews
        : allNews.filter((item) => item.category === currentCategory);

      if (!filtered.length) {
        container.innerHTML = `<div class="empty">${UI_TEXT[currentLang].empty}</div>`;
        return;
      }

      container.innerHTML = filtered.map((item) => {
        const title = getLocalizedField(item.title);
        const summary = getLocalizedField(item.summary);
        const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleString() : '';

        return `
          <article class="news-card">
            <div class="meta">
              <span class="badge">${item.category || 'news'}</span>
              <span>${item.source || ''}</span>
              <span>${dateStr}</span>
            </div>
            <h2 class="news-title">${title}</h2>
            <p class="news-summary">${summary}</p>
            ${item.link ? `<a class="read-more" href="${item.link}" target="_blank" rel="noopener">${UI_TEXT[currentLang].readMore}</a>` : ''}
          </article>
        `;
      }).join('');
    }

    async function loadNews() {
      const paths = ['../public/data/news.json', './public/data/news.json', '/public/data/news.json'];
      for (const p of paths) {
        try {
          const res = await fetch(`${p}?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              allNews = data;
              renderNews();
              return;
            }
          }
        } catch (e) {}
      }
      renderNews();
    }

    loadNews();
  </script>
</body>
</html>
