

<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#06140d">

<title>NOZHDAR STUDIO</title>

<style>

:root{--bg:#06140d;--panel:#102719;--gold:#e0b84f;--cream:#f7f0dc;--muted:#b4c0b5}

*{box-sizing:border-box}

body{margin:0;background:radial-gradient(ellipse at top,#173e27,#06140d 70%);color:var(--cream);font:16px/1.7 Arial,sans-serif}

.wrap{max-width:1050px;width:94%;margin:auto}

header{position:sticky;top:0;background:#06140df5;border-bottom:1px solid #78642e;z-index:5}

.head{display:flex;justify-content:space-between;align-items:center;padding:15px 0;gap:10px}

.brand{display:flex;align-items:center;gap:12px}

.logo{font:40px Georgia;color:var(--gold);border:2px solid var(--gold);padding:0 10px}

.brand strong{letter-spacing:3px;font-size:20px}

.brand small{display:block;color:var(--gold);letter-spacing:5px}

select,input,button{background:#102719;color:var(--cream);border:1px solid #645b37;border-radius:9px;padding:11px;font:inherit}

select{max-width:175px}

.hero{padding:30px 0 20px}

.eyebrow{color:var(--gold);letter-spacing:3px;font-size:11px}

h1{font:clamp(42px,8vw,68px) Georgia;margin:8px 0}

.hero p{color:var(--muted);font-size:18px}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}

.filters button{font-weight:bold}

.filters button.active{background:var(--gold);color:#102116}

.tools{display:flex;gap:9px;margin:15px 0}

.tools input{flex:1;min-width:100px}

.section{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #66582e;margin:25px 0 14px}

.section h2{font:25px Georgia}

.section span{color:var(--gold);font-size:11px}

.feature,.card{background:linear-gradient(145deg,#12341f,#08180f);border:1px solid var(--gold);border-radius:15px;overflow:hidden;margin-bottom:18px}

.feature img{width:100%;max-height:440px;object-fit:cover;display:block}

.feature-body{padding:18px}

.feature h2{font:clamp(25px,5vw,40px)/1.3 Georgia}

.feature p,.card p{color:#d4ded3;line-height:1.9}

.meta{color:var(--muted);font-size:12px}

.source{color:var(--gold)}

.read{display:inline-block;border:1px solid var(--gold);padding:7px 14px;border-radius:25px;color:var(--gold);margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.card{border-color:#655b36}

.card img{width:100%;height:190px;object-fit:cover}

.card-body{padding:14px}

.card h3{font:22px/1.4 Georgia}

.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #756638;border-radius:12px}

footer{border-top:1px solid #66582e;margin-top:35px;padding:20px 0;color:var(--muted);font-size:12px}

@media(max-width:650px){.head{align-items:flex-start}.brand strong{font-size:16px}.logo{font-size:30px}.head select{max-width:130px;font-size:12px}.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:110px 1fr}.card img{height:100%;min-height:150px}.card h3{font-size:17px}.card p{font-size:12px}.hero p{font-size:15px}}

</style>

</head>

<body>

<div class="wrap">

<header><div class="head">

<div class="brand"><div class="logo">N</div><div><strong>NOZHDAR</strong><small>STUDIO</small></div></div>

<select id="language">

<option value="bad">کوردی بادینی</option>

<option value="ku" selected>کوردی سۆرانی</option>

<option value="km">Kurmancî</option>

<option value="en">English</option>

<option value="it">Italiano</option>

<option value="ar">العربية</option>

<option value="ma">الدارجة المغربية</option>

<option value="tn">التونسية</option>

<option value="dz">الدارجة الجزائرية</option>

<option value="tr">Türkçe</option>

<option value="fa">فارسی</option>

<option value="sq">Shqip</option>

<option value="ur">اردو</option>

<option value="hi">हिन्दी</option>

<option value="bn">বাংলা</option>

<option value="ps">پښتو</option>

</select>

</div></header>

<section class="hero">

<div class="eyebrow">NOZHDAR STUDIO / INDEPENDENT NEWS</div>

<h1 id="heading">هەواڵ</h1>

<p id="intro">هەواڵە نوێیەکان لە ناوچەکان و سەرتاسەری ئیتالیا.</p>

</section>

<div class="tools">

<input id="search" placeholder="گەڕان لە هەواڵەکاندا…">

<button id="refresh">↻ نوێکردنەوە</button>

</div>

<nav class="filters" id="filters">

<button class="active" data-tab="all">هەموو</button>

<button data-tab="regional">هەواڵی ناوچەکان</button>

<button data-tab="immigration">کۆچبەران / ئیتالیا</button>

</nav>

<div class="filters">

<select id="region"><option value="all">هەموو ناوچەکان</option></select>

<select id="category">

<option value="all">هەموو جۆرەکان</option>

<option value="local">هەواڵی ناوخۆیی</option>

<option value="law">کۆچبەران و یاسا</option>

</select>

</div>

<div class="section"><h2 id="top">هەواڵی سەرەکی</h2><span id="status">NOZHDAR LIVE</span></div>

<div id="featured" class="feature"><div class="feature-body">هەواڵەکان بار دەکرێن…</div></div>

<div class="section"><h2 id="latest">دوایین هەواڵەکان</h2><span id="count">0 NEWS</span></div>

<main id="news" class="grid"><div class="empty">هەواڵەکان بار دەکرێن…</div></main>

<footer>© <span id="year"></span> NOZHDAR STUDIO · 16 LANGUAGES · ITALY NEWS & LAW</footer>

</div>

<script>

const $=id=>document.getElementById(id);

const special='italia-immigrazione';

let items=[],regions=[],tab='all',lang='ku';

const words={

ku:['هەواڵ','هەواڵە نوێیەکان لە ناوچەکان و سەرتاسەری ئیتالیا.','هەموو','هەواڵی ناوچەکان','کۆچبەران / ئیتالیا','هەواڵی سەرەکی','دوایین هەواڵەکان','گەڕان لە هەواڵەکاندا…','نوێکردنەوە','هیچ هەواڵێک نەدۆزرایەوە.','وردەکاری زیاتر'],

bad:['هەواڵ','هەواڵێن نوی ژ ناڤچەیان و ئیتالیایێ.','هەمی','هەواڵێ ناڤچەیان','کۆچبەران / ئیتالیایێ','هەواڵا سەرەکی','دوماهیک هەواڵ','ل هەواڵان بگەڕێ…','نوێ بکە','هیچ هەواڵ نەهاتە دیتن.','زێدەتر بخوینە'],

km:['Nûçe','Nûçeyên herêmî û ji tevahiya Îtalyayê.','Hemû','Nûçeyên herêmî','Koçberî / Îtalya','Nûçeya sereke','Nûçeyên dawî','Di nûçeyan de bigere…','Nû bike','Nûçe nehat dîtin.','Zêdetir bixwîne'],

en:['News','Latest regional updates and important news from across Italy.','All','Regional news','Immigration / Italy','Top story','Latest news','Search news…','Refresh','No stories found.','Read more'],

it:['Notizie','Ultime notizie locali e aggiornamenti da tutta Italia.','Tutte','Notizie regionali','Immigrazione / Italia','Notizia principale','Ultime notizie','Cerca notizie…','Aggiorna','Nessuna notizia trovata.','Leggi di più'],

ar:['الأخبار','آخر الأخبار المحلية والمستجدات من إيطاليا.','الكل','أخبار المناطق','الهجرة / إيطاليا','الخبر الرئيسي','آخر الأخبار','ابحث في الأخبار…','تحديث','لا توجد أخبار.','اقرأ المزيد'],

ma:['الأخبار','آخر الأخبار المحلية والمستجدات من إيطاليا.','الكل','أخبار محلية','الهجرة / إيطاليا','الخبر الرئيسي','آخر الأخبار','قلب على الأخبار…','تحديث','ما كايناش أخبار.','قرا المزيد'],

tn:['الأخبار','آخر الأخبار المحلية وأهم المستجدات من إيطاليا.','الكل','أخبار محلية','الهجرة / إيطاليا','الخبر الرئيسي','آخر الأخبار','لوّج على الأخبار…','تحديث','ما فماش أخبار.','اقرا المزيد'],

dz:['الأخبار','آخر الأخبار المحلية من كامل إيطاليا.','الكل','أخبار محلية','الهجرة / إيطاليا','الخبر الرئيسي','آخر الأخبار','قلب على الأخبار…','تحديث','ماكانش أخبار.','اقرا المزيد'],

tr:['Haberler','İtalya genelinden son haberler.','Tümü','Bölgesel haberler','Göç / İtalya','Öne çıkan haber','Son haberler','Haberlerde ara…','Yenile','Haber bulunamadı.','Devamını oku'],

fa:['اخبار','آخرین اخبار منطقه‌ای و سراسر ایتالیا.','همه','اخبار منطقه‌ای','مهاجرت / ایتالیا','خبر برتر','آخرین اخبار','جستجو…','تازه‌سازی','خبری پیدا نشد.','ادامه مطلب'],

sq:['Lajme','Lajmet e fundit nga Italia.','Të gjitha','Lajme rajonale','Emigracioni / Italia','Lajmi kryesor','Lajmet e fundit','Kërko lajme…','Përditëso','Nuk u gjet lajm.','Lexo më shumë'],

ur:['خبریں','اٹلی بھر کی تازہ خبریں۔','سب','علاقائی خبریں','امیگریشن / اٹلی','اہم خبر','تازہ ترین خبریں','خبریں تلاش کریں…','تازہ کریں','کوئی خبر نہیں ملی۔','مزید پڑھیں'],

hi:['समाचार','इटली की ताज़ा क्षेत्रीय खबरें।','सभी','क्षेत्रीय समाचार','आव्रजन / इटली','मुख्य खबर','ताज़ा खबरें','खबरें खोजें…','रिफ्रेश','कोई खबर नहीं मिली।','और पढ़ें'],

bn:['সংবাদ','ইতালির সর্বশেষ আঞ্চলিক খবর।','সব','আঞ্চলিক সংবাদ','অভিবাসন / ইতালি','প্রধান খবর','সর্বশেষ খবর','খবর খুঁজুন…','রিফ্রেশ','কোনো খবর পাওয়া যায়নি।','আরও পড়ুন'],

ps:['خبرونه','د ایټالیا وروستي سیمه‌ییز خبرونه.','ټول','سیمه‌ییز خبرونه','کډوالي / ایټالیا','مهم خبر','وروستي خبرونه','خبرونه ولټوئ…','تازه کول','خبر ونه موندل شو.','نور ولولئ']

};

const rtl=['ku','bad','ar','ma','tn','dz','fa','ur','ps'];

function textOf(n,k){let v=n[k];return v&&typeof v==='object'?(v[lang]||v.en||v.it||v.ku||Object.values(v)[0]||''):v||''}

function tr(i){return words[lang]?.[i]||words.en[i]}

function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function dateOf(n){let d=new Date(n.date||n.pubDate||'');return isNaN(d)?'':d.toLocaleDateString()}

function applyLanguage(){

lang=$('language').value;

document.documentElement.lang=lang;

document.documentElement.dir=rtl.includes(lang)?'rtl':'ltr';

$('heading').textContent=tr(0);$('intro').textContent=tr(1);

$('top').textContent=tr(5);$('latest').textContent=tr(6);

$('search').placeholder=tr(7);$('refresh').textContent='↻ '+tr(8);

$('filters').innerHTML=`<button data-tab="all">${tr(2)}</button><button data-tab="regional">${tr(3)}</button><button data-tab="immigration">${tr(4)}</button>`;

$('filters').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}});

render();

}

function filtered(){

let a=[...items];

if(tab==='regional')a=a.filter(n=>n.region!==special);

if(tab==='immigration')a=a.filter(n=>n.region===special||n.category==='immigration-law');

let r=$('region').value;if(r!=='all'&&tab!=='immigration')a=a.filter(n=>n.region===r);

let c=$('category').value;

if(c==='local')a=a.filter(n=>n.region!==special);

if(c==='law')a=a.filter(n=>n.region===special||n.category==='immigration-law');

let q=$('search').value.toLowerCase().trim();

if(q)a=a.filter(n=>(textOf(n,'title')+' '+textOf(n,'summary')+' '+(n.source||'')).toLowerCase().includes(q));

return a.sort((x,y)=>new Date(y.date||y.pubDate)-new Date(x.date||x.pubDate));

}

function card(n,featured=false){

let title=escapeHTML(textOf(n,'title')),summary=escapeHTML(textOf(n,'summary')||textOf(n,'content'));

let image=n.image?`<img src="${escapeHTML(n.image)}" alt="" loading="lazy">`:'';

let body=`<div class="${featured?'feature-body':'card-body'}"><div class="meta">${escapeHTML(dateOf(n))} · ${escapeHTML(n.regionName||'Italy')}</div><h${featured?'2':'3'}>${title}</h${featured?'2':'3'}><p>${summary}</p><div class="source">${escapeHTML(n.source||'NOZHDAR')}</div><a class="read" href="${escapeHTML(n.link)}" target="_blank" rel="noopener">${tr(10)} ›</a></div>`;

return featured?`<article class="feature">${image}${body}</article>`:`<article class="card"><a href="${escapeHTML(n.link)}" target="_blank" rel="noopener">${image}</a>${body}</article>`;

}

function render(){

let a=filtered();$('count').textContent=a.length+' NEWS';

if(!a.length){$('featured').innerHTML=`<div class="feature-body">${tr(9)}</div>`;$('news').innerHTML=`<div class="empty">${tr(9)}</div>`;return}

$('featured').outerHTML=card(a[0],true);

$('news').innerHTML=a.slice(1).map(n=>card(n)).join('');

}

async function load(){

try{

let [n,r]=await Promise.all([fetch('/data/news.json?t='+Date.now()),fetch('/data/regions.json')]);

if(!n.ok||!r.ok)throw Error('Missing data');

let nd=await n.json();items=Array.isArray(nd)?nd:(nd.items||[]);regions=await r.json();

$('region').innerHTML='<option value="all">All regions</option>'+regions.filter(x=>x.id!==special).map(x=>`<option value="${escapeHTML(x.id)}">${escapeHTML(x.name)}</option>`).join('');

$('status').textContent='UPDATED '+(nd.updatedAt?new Date(nd.updatedAt).toLocaleString():'');

render();

}catch(e){$('featured').innerHTML='<div class="feature-body">News data is not available. Check the news JSON files.</div>';$('news').innerHTML='<div class="empty">News data is not available yet.</div>'}

}

$('language').onchange=applyLanguage;

$('search').oninput=render;

$('region').onchange=render;

$('category').onchange=render;

$('refresh').onclick=load;

$('year').textContent=new Date().getFullYear();

applyLanguage();load();

</script>

</body>

</html>
