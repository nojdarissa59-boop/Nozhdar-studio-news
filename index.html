function featureHTML(n){
 const title=getText(n,'title'),summary=getText(n,'summary'),content=getText(n,'content');
 const img=n.image?`<div class="feature-image"><img src="${esc(n.image)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-image');this.remove()"><div class="feature-overlay">${n.official?`<span class="pill">★ ${tr('official')}</span>`:''}<h2>${esc(title)}</h2><div class="meta"><span>${esc(dateLabel(n))}</span><span>${esc(n.source||'')}</span><span>${esc(n.regionName||'Italy')}</span></div></div></div>`:`<div class="feature-image no-image"><div class="feature-overlay">${n.official?`<span class="pill">★ ${tr('official')}</span>`:''}<h2>${esc(title)}</h2><div class="meta"><span>${esc(dateLabel(n))}</span><span>${esc(n.source||'')}</span></div></div></div>`;
 return `<article id="featured" class="feature">${img}<div class="feature-copy"><p>${esc(summary||content)}</p><div class="source-line"><span>${tr('source')}: ${esc(n.source||'')}</span><a class="source-button" href="${esc(n.link)}" target="_blank" rel="noopener">${tr('read')} ›</a></div></div></article>`;
}
function cardHTML(n){
 return `<article class="card"><a href="${esc(n.link)}" target="_blank" rel="noopener">${n.image?`<img src="${esc(n.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}<div class="card-body"><div class="meta"><span>${esc(dateLabel(n))}</span><span>${esc(n.regionName||'Italy')}</span></div><h3>${esc(getText(n,'title'))}</h3><p>${esc(getText(n,'summary'))}</p><span class="source-button">${esc(n.source||tr('source'))} ›</span></div></a></article>`;
}
function render(){
 buildTabs();const list=eligible();$('count').textContent=list.length+' NEWS';
 if(!list.length){$('featured').innerHTML=`<div class="feature-copy"><p>${tr('empty')}</p></div>`;$('news').innerHTML=`<div class="empty">${tr('empty')}<br><small>Check GitHub Actions and the translation secret.</small></div>`;return}
 $('featured').outerHTML=featureHTML(list[0]);$('news').innerHTML=list.slice(1).map(cardHTML).join('')||`<div class="empty">${tr('empty')}</div>`;
}
async function load(){
 $('news').innerHTML='<div class="empty">Loading…</div>';
 try{const response=await fetch('/data/news.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('news.json missing');const data=await response.json();news=Array.isArray(data)?data:(data.items||[]);$('updated').textContent='UPDATED '+(data.updatedAt?new Date(data.updatedAt).toLocaleString():'');render()}
 catch(e){$('featured').innerHTML='<div class="feature-copy">News data is not available yet.</div>';$('news').innerHTML='<div class="empty">News data is not available yet. Run the GitHub Actions workflow.</div>'}
}
$('language').addEventListener('change',applyLanguage);$('region').addEventListener('change',render);$('kind').addEventListener('change',render);$('search').addEventListener('input',render);$('refresh').addEventListener('click',load);$('year').textContent=new Date().getFullYear();
fetch('/data/regions.json').then(r=>r.json()).then(data=>{regions=data;$('region').innerHTML=regions.filter(r=>r.id!==special).map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');$('region').value=regions.some(r=>r.id==='trentino-alto-adige')?'trentino-alto-adige':(regions[0]?.id||'');applyLanguage();load()}).catch(()=>load());
</script>
</body></html>
