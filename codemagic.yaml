# Codemagic: بنیاتنانی ئەپی ئایفۆن و ئەندرۆید
# ئەم فایلە تەنها بنیاتنان دەکات. دواتر بۆ ئاپڵۆدکردن بۆ ستۆر زیادی دەکەین.
workflows:
  ios-app-store:
    name: iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Create iOS project
        script: |
          npx cap add ios
          npx cap sync ios
    artifacts:
      - ios/App/build/**/*.ipa

  android-play-store:
    name: Android build
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      node: 20
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Create Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
