
name: Auto Fetch & Translate News

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nozhdar-news-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install news dependencies
        run: npm install rss-parser @extractus/article-extractor

      - name: Fetch and save original news
        env:
          NEWS_MODE: fetch
          MAX_ITEMS_PER_FEED: '6'
        run: node scripts/fetch-news.js

      - name: Translate saved news (optional)
        env:
          NEWS_MODE: translate
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.8-flash,gemini-3.6-flash
          MAX_NEW_TRANSLATIONS: '9'
        run: node scripts/fetch-news.js

      - name: Commit and push updated news
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/data/news.json public/data/regions.json
          if git diff --staged --quiet; then
            echo "No news data changes to commit"
          else
            git commit -m "Update news"
            git push
          fi
