
name: Auto Fetch & Translate News

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch and translate news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
          MAX_NEW_TRANSLATIONS: '9'
          MAX_ITEMS_PER_FEED: '6'
        run: node scripts/fetch-news.js

      - name: Commit and push updated news
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No changes to public/data/news.json"
          else
            git commit -m "Update news"
            git push
          fi
