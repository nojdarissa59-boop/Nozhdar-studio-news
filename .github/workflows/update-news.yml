name: Auto Fetch & Translate News

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nozhdar-news-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install news dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund rss-parser @extractus/article-extractor

      - name: Fetch and save original news
        env:
          NEWS_MODE: fetch
          MAX_ITEMS_PER_FEED: '6'
        run: node scripts/fetch-news.js

      - name: Translate saved news (optional)
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        env:
          NEWS_MODE: translate
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-2.5-flash
          MAX_NEW_TRANSLATIONS: '15'
        run: node scripts/fetch-news.js

      - name: Commit and push updated news
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/data/news.json public/data/regions.json
          if git diff --staged --quiet; then
            echo "No news data changes to commit"
          else
            git commit -m "Update news"
            git pull --rebase origin main || true
            git push
          fi
