name: Auto Fetch & Translate News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch and translate news
        env:
  GEMINI_MODELS: gemini-3.8-flash,ناوی-مۆدێلی-دووەم
        run: node scripts/fetch-news.js

      - name: Commit and push updated news
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No changes to public/data/news.json"
          else
            git commit -m "Update translated news JSON"
            git push
          fi
